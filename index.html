<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1d1a1a" />
    <title>PixiJS Snake v8</title>

    <style>
      /* ── Reset ─────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ── Full-screen shell ──────────────────────────────── */
      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #111;
        touch-action: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      /* The Pixi canvas fills the entire viewport */
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* ── D-Pad overlay (Mobile Controls) ──────────────────── */
      #dpad {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom, 16px));
        right: max(16px, env(safe-area-inset-right, 16px));
        display: grid;
        grid-template-columns: repeat(3, 50px);
        grid-template-rows: repeat(3, 50px);
        gap: 3px;
        z-index: 100;
        opacity: 0.85;
        animation: fadeIn 0.4s ease;
      }

      @media (max-width: 480px) {
        #dpad {
          grid-template-columns: repeat(3, 40px);
          grid-template-rows: repeat(3, 40px);
          gap: 2px;
          bottom: max(12px, env(safe-area-inset-bottom, 12px));
          right: max(12px, env(safe-area-inset-right, 12px));
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 0.85;
        }
      }

      /* Individual arrow buttons */
      .dpad-btn {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        background: rgba(30, 30, 40, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: #fff;
        font-size: 20px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
        transition: background 0.08s, transform 0.08s, border-color 0.08s;
      }

      @media (max-width: 480px) {
        .dpad-btn {
          width: 40px;
          height: 40px;
          font-size: 16px;
          border-radius: 6px;
        }
      }

      .dpad-btn.active {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.55);
        transform: scale(0.91);
      }

      /* Grid placement */
      #btn-up {
        grid-area: 1 / 2;
      }
      #btn-left {
        grid-area: 2 / 1;
      }
      #btn-right {
        grid-area: 2 / 3;
      }
      #btn-down {
        grid-area: 3 / 2;
      }

      /* Hide D-pad on desktop */
      @media (hover: hover) and (pointer: fine) {
        #dpad {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Mobile D-pad Controls -->
    <div id="dpad" aria-label="Directional pad">
      <button id="btn-up" class="dpad-btn" aria-label="Up">▲</button>
      <button id="btn-left" class="dpad-btn" aria-label="Left">◀</button>
      <button id="btn-right" class="dpad-btn" aria-label="Right">▶</button>
      <button id="btn-down" class="dpad-btn" aria-label="Down">▼</button>
    </div>

    <script>
      // ── D-pad → Keyboard bridge ──────────────────────────────────────────────
      const MAP = {
        "btn-up": "ArrowUp",
        "btn-down": "ArrowDown",
        "btn-left": "ArrowLeft",
        "btn-right": "ArrowRight",
      };

      function fireKey(code, type) {
        window.dispatchEvent(
          new KeyboardEvent(type, {
            key: code,
            code: code,
            bubbles: true,
            cancelable: true,
          }),
        );
      }

      Object.entries(MAP).forEach(([id, code]) => {
        const btn = document.getElementById(id);
        if (!btn) return;

        btn.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            btn.classList.add("active");
            fireKey(code, "keydown");
          },
          { passive: false },
        );

        btn.addEventListener(
          "touchend",
          (e) => {
            e.preventDefault();
            btn.classList.remove("active");
            fireKey(code, "keyup");
          },
          { passive: false },
        );

        btn.addEventListener("touchcancel", () => {
          btn.classList.remove("active");
          fireKey(code, "keyup");
        });

        btn.addEventListener("mousedown", () => {
          btn.classList.add("active");
          fireKey(code, "keydown");
        });
        btn.addEventListener("mouseup", () => {
          btn.classList.remove("active");
          fireKey(code, "keyup");
        });
      });
    </script>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
